
name: Test Bitvavo bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile bitvavo_paper_trader.py
      - name: Test Bitvavo public API
        run: |
          python -c "import requests; markets=requests.get('https://api.bitvavo.com/v2/markets', timeout=15).json(); eur=[m for m in markets if m.get('quote')=='EUR' and m.get('status')=='trading']; print('EUR-markten gevonden:', len(eur)); print('Eerste markt:', eur[0]['market'] if eur else 'geen')"
